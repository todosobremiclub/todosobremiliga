<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar - Todo Sobre mi Liga</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <h1>Todo Sobre mi Liga</h1>
    <form id="formLogin">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">

      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password">

      <button type="submit">Ingresar</button>
      <p class="error-msg" id="errorMsg"></p>
    </form>
  </div>

  <script>
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = '';

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok || !data.ok) {
          errorMsg.textContent = (data && data.error) || 'No se pudo iniciar sesión';
          return;
        }

        localStorage.setItem('tsmliga_token', data.token);
        localStorage.setItem('tsmliga_usuario', JSON.stringify(data.usuario));

        switch (data.usuario.rol) {
          case 'super_admin': window.location.href = '/admin.html'; break;
          case 'liga_admin': window.location.href = '/liga.html'; break;
          case 'club_admin': window.location.href = '/club.html'; break;
          default: errorMsg.textContent = 'Tu tipo de usuario todavía no tiene un panel asignado.';
        }
      } catch (err) {
        errorMsg.textContent = 'Error de conexión con el servidor';
      }
    });
  </script>
</body>
</html>
