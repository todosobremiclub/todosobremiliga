<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>División - Todo Sobre mi Liga</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .tab-btn {
    background: var(--blanco); border: 1px solid var(--gris-300); border-radius: var(--radio);
    padding: 8px 16px; font-size: 13px; cursor: pointer; font-weight: 600; color: var(--gris-600);
  }
  .tab-btn.activo { background: var(--azul); color: var(--blanco); border-color: var(--azul); }
  .fondo-modal-generico {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 55;
  }
  .popup-modal {
    position: fixed; top: 6%; left: 50%; transform: translateX(-50%);
    width: min(560px, 94vw); max-height: 88vh; overflow-y: auto;
    z-index: 60; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    background: rgba(255,255,255,0.06); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: var(--radio); padding: 20px;
  }
  .fila-partido-clickable { cursor: pointer; transition: background 0.15s; }
  .fila-partido-clickable:hover { background: rgba(255,255,255,0.07); }
</style>
</head>
<body class="liga-fondo-cancha">
  <div class="sitio-header">
    <div class="sitio-header-inner">
      <div>
        <h1 id="nombreCategoria">Cargando...</h1>
        <div class="sitio-breadcrumb"><a href="/sitio/index.html" id="linkVolverLiga">← Todas las Ligas</a></div>
      </div>
    </div>
  </div>

  <div class="sitio-contenido">
    <div class="sitio-tabs">
      <button class="tab-btn activo" id="tabBtnTabla">Tabla de posiciones</button>
      <button class="tab-btn" id="tabBtnFixture">Fixture y resultados</button>
      <button class="tab-btn" id="tabBtnGoleadores">Goleadores</button>
      <button class="tab-btn" id="tabBtnTarjetas">Tarjetas</button>
    </div>

    <div class="panel" id="seccionTabla">
      <div class="tabla-scroll">
      <table>
        <thead><tr><th>Club</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>Dif</th><th>Pts</th><th>Últimas</th></tr></thead>
        <tbody id="tablaPosiciones"><tr><td colspan="10">Cargando...</td></tr></tbody>
      </table>
      </div>
    </div>

    <div class="panel oculto" id="seccionFixture">
      <div id="navegadorJornadasPublico" class="oculto" style="display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:14px;">
        <button class="btn btn-secundario btn-pequeno" id="btnJornadaAnteriorPublico">← Anterior</button>
        <span id="tituloJornadaActualPublico" style="font-weight:700;"></span>
        <button class="btn btn-secundario btn-pequeno" id="btnJornadaSiguientePublico">Siguiente →</button>
      </div>
      <div id="contenedorPartidosJornadaPublico"><p class="sitio-vacio">Cargando...</p></div>
    </div>

    <div class="panel oculto" id="seccionGoleadores">
      <table>
        <thead><tr><th>Jugador</th><th>Club</th><th>Goles</th></tr></thead>
        <tbody id="tablaGoleadoresPublico"><tr><td colspan="3">Cargando...</td></tr></tbody>
      </table>
    </div>

    <div class="panel oculto" id="seccionTarjetas">
      <table>
        <thead><tr><th>Jugador</th><th>Club</th><th>Amarillas</th><th>Rojas</th></tr></thead>
        <tbody id="tablaTarjetasPublico"><tr><td colspan="4">Cargando...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Popup con el detalle grande de un partido (goleadores/tarjetas si
       hay), al hacer click sobre un partido del Fixture. -->
  <div class="oculto fondo-modal-generico" id="fondoModalPartido" onclick="cerrarDetallePartido()"></div>
  <div class="popup-modal oculto" id="panelDetallePartido">
    <div style="display:flex; justify-content:flex-end; margin-bottom:6px;">
      <button class="btn btn-secundario btn-pequeno" id="btnCerrarDetallePartido" onclick="cerrarDetallePartido()">Cerrar</button>
    </div>
    <div id="detallePartidoContenido"><p class="sitio-vacio">Cargando...</p></div>
  </div>

  <div id="footerLiga"></div>

  <script src="/sitio/js/sitio-tema.js"></script>
  <script src="/sitio/js/sitio-categoria.js"></script>
</body>
</html>
