<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liga - Todo Sobre mi Liga</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="liga-fondo-cancha">
  <div class="sitio-header">
    <div class="sitio-header-inner sitio-header-inner-centrado">
      <div>
        <h1 id="nombreLiga">Cargando...</h1>
        <div class="sitio-breadcrumb"><a href="/sitio/index.html">← Todas las Ligas</a></div>
      </div>
      <img id="logoLiga" class="sitio-logo sitio-logo-grande oculto" alt="Logo">
      <span></span>
    </div>
  </div>

  <div class="sitio-contenido">
    <h2 style="margin-top:0;">Torneos</h2>

    <div class="buscador-clubes">
      <input type="text" id="buscadorClubesLiga" placeholder="Buscar un club...">
      <div id="resultadosBuscadorClubes" class="buscador-clubes-resultados oculto"></div>
    </div>

    <div id="listaTorneos" class="grid-cards grid-cards-torneos">
      <p class="sitio-vacio">Cargando...</p>
    </div>

    <h2>Noticias</h2>
    <div id="listaNoticias">
      <p class="sitio-vacio">Cargando...</p>
    </div>
  </div>

  <!-- Popup compartido con la noticia completa (texto entero, imagen y
       video de YouTube si tiene), usado por el carrusel de Noticias. -->
  <div class="oculto fondo-modal-generico" id="fondoModalNoticiaCompleta" onclick="cerrarNoticiaCompleta()"></div>
  <div class="popup-modal popup-modal-noticia oculto" id="modalNoticiaCompleta">
    <div style="display:flex; justify-content:flex-end; margin-bottom:6px;">
      <button class="btn btn-secundario btn-pequeno" onclick="cerrarNoticiaCompleta()">Cerrar</button>
    </div>
    <h2 id="tituloNoticiaCompleta" style="margin-top:0;"></h2>
    <div class="noticia-fecha" id="fechaNoticiaCompleta"></div>
    <img id="imagenNoticiaCompleta" class="oculto" alt="">
    <div id="videoNoticiaCompleta" class="noticia-video-embed"></div>
    <p id="contenidoNoticiaCompleta" class="noticia-contenido" style="white-space:pre-wrap;"></p>
  </div>

  <div id="footerLiga"></div>

  <script src="/sitio/js/sitio-tema.js"></script>
  <script src="/sitio/js/sitio-noticias.js"></script>
  <script src="/sitio/js/sitio-liga.js"></script>
</body>
</html>
